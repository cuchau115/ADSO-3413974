<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1320" viewBox="0 0 1960 1320" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de casos de uso de SIGRES</title>
  <desc id="description">Diagrama UML de casos de uso con los 17 requisitos funcionales, actores principales Mesero y Cliente, actores de apoyo y relaciones include y extend.</desc>
  <defs>
    <marker id="openArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243447; }
      .title { font-size: 30px; font-weight: 700; }
      .boundary { fill: #fff; fill-opacity: .55; stroke: #526579; stroke-width: 2; stroke-dasharray: 9 7; }
      .actor { stroke: #243447; stroke-width: 3; fill: none; stroke-linecap: round; }
      .actor-label { font-size: 15px; text-anchor: middle; }
      .uc { stroke-width: 2; }
      .uc-label { font-size: 14px; text-anchor: middle; font-weight: 600; }
      .association { fill: none; stroke: #8a98a6; stroke-width: 1.5; }
      .relation { fill: none; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#openArrow); }
      .legend { font-size: 14px; }
    </style>
  </defs>
  <rect width="1960" height="1320" fill="#f7f9fc"/>
  <text class="title" x="980" y="42" text-anchor="middle">SIGRES — Diagrama de casos de uso</text>
  <rect class="boundary" x="250" y="90" width="1400" height="1150" rx="4"/>
  <text x="275" y="122" font-size="21" font-weight="700">SIGRES</text>

  <!-- Associations are behind actors and use cases. -->
  <g class="association">
    <path d="M145 158 H550 V189 H620"/>
    <path d="M145 397 H220 V125 H550 V329 H620"/>
    <path d="M145 410 H220 V125 H550 V469 H620"/>
    <path d="M145 428 H220 V125 H550 V1029 H620"/>
    <path d="M1770 158 H1680 V125 H550 V469 H840"/>
    <path d="M1770 170 H1680 V189 H1500"/>
    <path d="M1770 182 H1680 V369 H1500"/>
    <path d="M145 700 H230 V189 H290"/>
    <path d="M145 700 H230 V309 H290"/>
    <path d="M145 700 H230 V449 H290"/>
    <path d="M145 700 H230 V589 H290"/>
    <path d="M145 700 H230 V729 H290"/>
    <path d="M145 700 H230 V869 H290"/>
    <path d="M145 700 H230 V1029 H620"/>
    <path d="M145 700 H230 V125 H1200 V1029 H1170"/>
    <path d="M1770 558 H1680 V125 H1200 V329 H1170"/>
    <path d="M1770 570 H1680 V125 H1200 V469 H1170"/>
    <path d="M1770 822 H1680 V729 H1500"/>
    <path d="M1770 838 H1680 V869 H1500"/>
    <path d="M1770 1100 H1680 V1029 H1170"/>
  </g>

  <!-- Supporting actor for authenticated restaurant staff -->
  <g class="actor">
    <circle cx="105" cy="130" r="15"/>
    <path d="M105 145 V195 M78 163 H132 M105 195 L82 226 M105 195 L128 226"/>
  </g>
  <text class="actor-label" x="105" y="249">Usuario del</text>
  <text class="actor-label" x="105" y="268">restaurante</text>

  <!-- Primary actors -->
  <g class="actor">
    <circle cx="105" cy="370" r="15"/>
    <path d="M105 385 V435 M78 403 H132 M105 435 L82 466 M105 435 L128 466"/>
  </g>
  <text class="actor-label" x="105" y="490">Mesero</text>
  <text class="actor-label" x="105" y="509">(primario)</text>
  <g class="actor">
    <circle cx="1820" cy="130" r="15"/>
    <path d="M1820 145 V195 M1793 163 H1847 M1820 195 L1797 226 M1820 195 L1843 226"/>
  </g>
  <text class="actor-label" x="1820" y="249">Cliente</text>
  <text class="actor-label" x="1820" y="268">(primario)</text>

  <!-- Supporting actors -->
  <g class="actor">
    <circle cx="105" cy="650" r="15"/>
    <path d="M105 665 V715 M78 683 H132 M105 715 L82 746 M105 715 L128 746"/>
  </g>
  <text class="actor-label" x="105" y="769">Administrador</text>
  <g class="actor">
    <circle cx="1820" cy="500" r="15"/>
    <path d="M1820 515 V565 M1793 533 H1847 M1820 565 L1797 596 M1820 565 L1843 596"/>
  </g>
  <text class="actor-label" x="1820" y="619">Personal de</text>
  <text class="actor-label" x="1820" y="638">cocina</text>
  <g class="actor">
    <circle cx="1820" cy="780" r="15"/>
    <path d="M1820 795 V845 M1793 813 H1847 M1820 845 L1797 876 M1820 845 L1843 876"/>
  </g>
  <text class="actor-label" x="1820" y="899">Cajero</text>
  <g class="actor">
    <circle cx="1820" cy="1060" r="15"/>
    <path d="M1820 1075 V1125 M1793 1093 H1847 M1820 1125 L1797 1156 M1820 1125 L1843 1156"/>
  </g>
  <text class="actor-label" x="1820" y="1179">Gerente</text>

  <!-- Use cases -->
  <g>
    <ellipse class="uc" cx="400" cy="189" rx="110" ry="39" fill="#dae8fc" stroke="#6c8ebf"/>
    <text class="uc-label" x="400" y="184"><tspan x="400">CU-01</tspan><tspan x="400" dy="18">Registrar usuario</tspan></text>
    <ellipse class="uc" cx="730" cy="189" rx="110" ry="39" fill="#dae8fc" stroke="#6c8ebf"/>
    <text class="uc-label" x="730" y="184"><tspan x="730">CU-02</tspan><tspan x="730" dy="18">Iniciar sesión</tspan></text>
    <ellipse class="uc" cx="400" cy="309" rx="110" ry="39" fill="#dae8fc" stroke="#6c8ebf"/>
    <text class="uc-label" x="400" y="304"><tspan x="400">CU-03</tspan><tspan x="400" dy="18">Gestionar roles y permisos</tspan></text>
    <ellipse class="uc" cx="730" cy="329" rx="110" ry="39" fill="#d5e8d4" stroke="#82b366"/>
    <text class="uc-label" x="730" y="324"><tspan x="730">CU-04</tspan><tspan x="730" dy="18">Registrar pedido</tspan></text>
    <ellipse class="uc" cx="1060" cy="329" rx="110" ry="39" fill="#d5e8d4" stroke="#82b366"/>
    <text class="uc-label" x="1060" y="324"><tspan x="1060">CU-05</tspan><tspan x="1060" dy="18">Enviar pedido a cocina</tspan></text>
    <ellipse class="uc" cx="730" cy="469" rx="110" ry="39" fill="#d5e8d4" stroke="#82b366"/>
    <text class="uc-label" x="730" y="464"><tspan x="730">CU-06</tspan><tspan x="730" dy="18">Consultar estado del pedido</tspan></text>
    <ellipse class="uc" cx="1060" cy="469" rx="110" ry="39" fill="#d5e8d4" stroke="#82b366"/>
    <text class="uc-label" x="1060" y="464"><tspan x="1060">CU-07</tspan><tspan x="1060" dy="18">Actualizar estado del pedido</tspan></text>
    <ellipse class="uc" cx="400" cy="449" rx="110" ry="39" fill="#fff2cc" stroke="#d6b656"/>
    <text class="uc-label" x="400" y="444"><tspan x="400">CU-08</tspan><tspan x="400" dy="18">Administrar productos del menú</tspan></text>
    <ellipse class="uc" cx="400" cy="589" rx="110" ry="39" fill="#fff2cc" stroke="#d6b656"/>
    <text class="uc-label" x="400" y="584"><tspan x="400">CU-09</tspan><tspan x="400" dy="18">Gestionar categorías del menú</tspan></text>
    <ellipse class="uc" cx="400" cy="729" rx="110" ry="39" fill="#fff2cc" stroke="#d6b656"/>
    <text class="uc-label" x="400" y="724"><tspan x="400">CU-10</tspan><tspan x="400" dy="18">Gestionar inventario</tspan></text>
    <ellipse class="uc" cx="400" cy="869" rx="110" ry="39" fill="#fff2cc" stroke="#d6b656"/>
    <text class="uc-label" x="400" y="864"><tspan x="400">CU-11</tspan><tspan x="400" dy="18">Generar alertas de stock mínimo</tspan></text>
    <ellipse class="uc" cx="1390" cy="729" rx="110" ry="39" fill="#f8cecc" stroke="#b85450"/>
    <text class="uc-label" x="1390" y="724"><tspan x="1390">CU-12</tspan><tspan x="1390" dy="18">Generar factura</tspan></text>
    <ellipse class="uc" cx="1390" cy="869" rx="110" ry="39" fill="#f8cecc" stroke="#b85450"/>
    <text class="uc-label" x="1390" y="864"><tspan x="1390">CU-13</tspan><tspan x="1390" dy="18">Procesar pago</tspan></text>
    <ellipse class="uc" cx="730" cy="1029" rx="110" ry="39" fill="#e1d5e7" stroke="#9673a6"/>
    <text class="uc-label" x="730" y="1024"><tspan x="730">CU-14</tspan><tspan x="730" dy="18">Gestionar mesas</tspan></text>
    <ellipse class="uc" cx="1060" cy="1029" rx="110" ry="39" fill="#e1d5e7" stroke="#9673a6"/>
    <text class="uc-label" x="1060" y="1024"><tspan x="1060">CU-15</tspan><tspan x="1060" dy="18">Generar reportes de ventas</tspan></text>
    <ellipse class="uc" cx="1390" cy="189" rx="110" ry="39" fill="#f5f5f5" stroke="#666"/>
    <text class="uc-label" x="1390" y="184"><tspan x="1390">CU-16</tspan><tspan x="1390" dy="18">Ver menú digital por QR</tspan></text>
    <ellipse class="uc" cx="1390" cy="369" rx="110" ry="39" fill="#f5f5f5" stroke="#666"/>
    <text class="uc-label" x="1390" y="364"><tspan x="1390">CU-17</tspan><tspan x="1390" dy="18">Consultar consumo actual</tspan></text>
  </g>

  <!-- Include and extend relations -->
  <path class="relation" d="M840 329 H950" stroke="#2e7d32"/>
  <text x="895" y="315" text-anchor="middle" font-size="13" fill="#2e7d32">«include»</text>
  <path class="relation" d="M1390 330 V230" stroke="#7b1fa2"/>
  <text x="1470" y="288" text-anchor="middle" font-size="13" fill="#7b1fa2">«extend»</text>
  <text x="1470" y="305" text-anchor="middle" font-size="12" fill="#7b1fa2">[pedido activo]</text>

  <text class="legend" x="275" y="1190">
    <tspan x="275">Relaciones:</tspan>
    <tspan x="275" dy="20" fill="#2e7d32">«include»: Registrar pedido → Enviar pedido a cocina.</tspan>
    <tspan x="275" dy="20" fill="#7b1fa2">«extend»: Consultar consumo actual → Ver menú digital por QR [pedido activo].</tspan>
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <rect width="1100" height="560" fill="#fff"/>
  <g font-family="Arial" font-size="16" fill="#111">
    <rect x="30" y="30" width="150" height="70" fill="#eef5ff" stroke="#222"/><text x="105" y="58" text-anchor="middle">Usuario</text><text x="105" y="82" text-anchor="middle">idUsuario, nombre, correo</text>
    <rect x="220" y="30" width="150" height="70" fill="#eef5ff" stroke="#222"/><text x="295" y="58" text-anchor="middle">Rol</text><text x="295" y="82" text-anchor="middle">idRol, permisos</text>
    <line x1="180" y1="65" x2="220" y2="65" stroke="#222"/><text x="200" y="58" text-anchor="middle">1</text>
    <rect x="30" y="145" width="150" height="70" fill="#fff8e8" stroke="#222"/><text x="105" y="173" text-anchor="middle">Mesa</text><text x="105" y="197" text-anchor="middle">numero, estado</text>
    <rect x="220" y="145" width="150" height="70" fill="#fff8e8" stroke="#222"/><text x="295" y="173" text-anchor="middle">Pedido</text><text x="295" y="197" text-anchor="middle">estado, fechaHora</text>
    <line x1="180" y1="180" x2="220" y2="180" stroke="#222"/><text x="200" y="170" text-anchor="middle">1  --  0..*</text>
    <rect x="410" y="145" width="170" height="70" fill="#fff8e8" stroke="#222"/><text x="495" y="173" text-anchor="middle">LineaPedido</text><text x="495" y="197" text-anchor="middle">cantidad, precioRegistrado</text>
    <line x1="370" y1="180" x2="410" y2="180" stroke="#222"/><text x="390" y="170" text-anchor="middle">1  --  1..*</text>
    <rect x="620" y="145" width="150" height="70" fill="#efffee" stroke="#222"/><text x="695" y="173" text-anchor="middle">Producto</text><text x="695" y="197" text-anchor="middle">nombre, precio</text>
    <line x1="580" y1="180" x2="620" y2="180" stroke="#222"/>
    <rect x="810" y="145" width="150" height="70" fill="#efffee" stroke="#222"/><text x="885" y="173" text-anchor="middle">Categoria</text><text x="885" y="197" text-anchor="middle">nombre, descripcion</text>
    <line x1="770" y1="180" x2="810" y2="180" stroke="#222"/><text x="790" y="170" text-anchor="middle">1  --  0..*</text>
    <rect x="220" y="260" width="150" height="70" fill="#f8efff" stroke="#222"/><text x="295" y="288" text-anchor="middle">Factura</text><text x="295" y="312" text-anchor="middle">numero, total</text>
    <rect x="410" y="260" width="150" height="70" fill="#f8efff" stroke="#222"/><text x="485" y="288" text-anchor="middle">Pago</text><text x="485" y="312" text-anchor="middle">metodo, monto</text>
    <line x1="370" y1="295" x2="410" y2="295" stroke="#222"/><text x="390" y="285" text-anchor="middle">1 -- 1</text>
    <rect x="620" y="260" width="150" height="70" fill="#efffee" stroke="#222"/><text x="695" y="288" text-anchor="middle">Inventario</text><text x="695" y="312" text-anchor="middle">actual, minimo</text>
    <rect x="810" y="260" width="180" height="70" fill="#efffee" stroke="#222"/><text x="900" y="288" text-anchor="middle">MovimientoInventario</text><text x="900" y="312" text-anchor="middle">tipo, cantidad</text>
    <line x1="770" y1="295" x2="810" y2="295" stroke="#222"/><text x="790" y="285" text-anchor="middle">1 -- 0..*</text>
    <rect x="220" y="375" width="180" height="70" fill="#f5f5f5" stroke="#222"/><text x="310" y="403" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text><text x="310" y="427" text-anchor="middle">ICalculadoraFactura</text>
    <rect x="440" y="375" width="180" height="70" fill="#f5f5f5" stroke="#222"/><text x="530" y="403" text-anchor="middle">CalculadoraIVA</text><text x="530" y="427" text-anchor="middle">calcular()</text>
    <rect x="660" y="375" width="180" height="70" fill="#f5f5f5" stroke="#222"/><text x="750" y="403" text-anchor="middle">CalculadoraPromocional</text><text x="750" y="427" text-anchor="middle">calcular()</text>
  </g>
